name: Publish to MCP Registry

on:
  push:
    branches: [main]
    paths:
      - 'server.json'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for GitHub OIDC authentication with the MCP Registry
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify server.json version matches api/version.js
        run: |
          FILE_VERSION=$(node -e "console.log(require('./api/version').version)")
          JSON_VERSION=$(node -e "console.log(require('./server.json').version)")
          if [ "$FILE_VERSION" != "$JSON_VERSION" ]; then
            echo "::error::server.json version ($JSON_VERSION) does not match api/version.js version ($FILE_VERSION)"
            exit 1
          fi
          echo "Versions match: $FILE_VERSION"

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          ASSET_NAME="mcp-publisher_${OS}_${ARCH}.tar.gz"
          RELEASE_JSON="$(curl -fsSL https://api.github.com/repos/modelcontextprotocol/registry/releases/latest)"
          EXPECTED_SHA256="$(echo "$RELEASE_JSON" | jq -r --arg name "$ASSET_NAME" '.assets[] | select(.name == $name) | .digest' | sed 's/^sha256://')"
          [ -n "$EXPECTED_SHA256" ]
          curl -fsSL -o "$ASSET_NAME" "https://github.com/modelcontextprotocol/registry/releases/latest/download/${ASSET_NAME}"
          echo "${EXPECTED_SHA256}  ${ASSET_NAME}" | sha256sum -c -
          tar xz -f "$ASSET_NAME" mcp-publisher
          chmod +x ./mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
