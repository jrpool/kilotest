              type: string
            priority:
              type: string
              enum:
                - lowest
                - low
                - high
                - highest
            related WCAG standard:
              type: object
              properties:
                layer:
                  type: string
                  enum:
                    - success criterion
                    - guideline
                identifier:
                  type: string
              required:
                - layer
                - identifier
              additionalProperties: false
          required:
            - identifier
            - summary
            - impact on a user
            - priority
            - related WCAG standard
          additionalProperties: false
        - type: object
          properties:
            error:
              type: string
          required:
            - error
          additionalProperties: false
    RequestedPage:
      type: object
      properties:
