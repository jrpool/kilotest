      summary: Request that a page not yet tested be tested
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                siteID:
                  description: 'For a page of a site in the listSites output: identifier of the site, formatted s-xxxxxx (example: s-2fw2ea). Give either siteID or siteName, not both.'
                  type: string
                  pattern: ^s-[0-9a-z]{6}$
                siteName:
                  description: 'For a page of a site not in the listSites output: 1- to 80-character name of the site, usually the name of the organization or brand that presents it; it must not match the name of any site in the listSites output, ignoring case, white space, and punctuation. Give either siteID or siteName, not both.'
                  type: string
                  minLength: 1
                  maxLength: 80
                pageName:
                  type: string
                  minLength: 1
                  maxLength: 120
                  description: 1- to 120-character name of the page, distinguishing it from every other page of the site (for the home page of a site, “home”)
                URL:
                  type: string
                  minLength: 12
                  maxLength: 300
                  pattern: ^https:\/\/
                  description: 12- to 300-character URL of the page, including the https:// scheme and any query; it must not redirect to a target this deployment disallows, such as a private, loopback, or link-local address
