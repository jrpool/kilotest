openapi: 3.1.0
info:
  title: Kilotest API
  description: 'Kilotest is an ensemble testing and reporting service for front-end web quality. It uses an ensemble of 10 rule engines to test public web pages for front-end quality (accessibility, usability, and standards conformity). Kilotest acts as a web server for human users, an MCP server for AI platforms, and an API for programmatic access. With this API you can request that a page be tested or retested, discover available reports, incrementally retrieve facts from a report: from what reports are available, to what issues were reported in one report, to what elements violated one issue, to what diagnoses rule engines gave for one violation.'
  version: 39.0.0
  contact:
    name: Kilotest
    url: https://github.com/jrpool/kilotest
    email: info@kilotest.com
servers:
  - url: https://kilotest.com
    description: Kilotest production server
paths:
  /api/listReports:
    get:
      operationId: listReports
      summary: List all available reports
      responses:
        '200':
          description: List all available reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  tool collection:
                    $ref: '#/components/schemas/ToolsFacts'
                  tool name:
                    type: string
                  this request:
                    type: object
                    properties:
                      description:
                        type: string
                      method:
                        type: string
                        const: GET
                      URL:
                        type: string
                      closest ancestor request:
                        anyOf:
                          - $ref: '#/components/schemas/RequestReference'
                          - type: 'null'
                    required:
                      - description
                      - method
                      - URL
                      - closest ancestor request
                    additionalProperties: false
                  URLs of similar requests for web users:
                    $ref: '#/components/schemas/SimilarWebRequests'
                  response metadata:
                    $ref: '#/components/schemas/ResponseMetadata'
                  response content:
                    type: object
                    properties:
                      basics about all available reports:
                        type: array
                        items:
                          type: object
                          properties:
                            identifier:
                              type: string
                              description: timeStamp-jobID identifier of the report.
                            completion date and time:
                              type: string
                            days since the report was completed:
                              type: number
                            tested web page:
                              type: object
                              properties:
                                description:
                                  type: string
                                URL:
                                  type: string
                              required:
                                - description
                                - URL
                              additionalProperties: false
                            whether a later report about the same page exists:
                              type: boolean
                            how to get details about the report:
                              type: object
                              properties:
                                method:
                                  type: string
                                  const: GET
                                URL:
                                  type: string
                              required:
                                - method
                                - URL
                              additionalProperties: false
                            web users can get details about the report at:
                              type: string
                          required:
                            - identifier
                            - completion date and time
                            - days since the report was completed
                            - tested web page
                            - whether a later report about the same page exists
                            - how to get details about the report
                            - web users can get details about the report at
                          additionalProperties: false
                      how to request that a page with no report be tested:
                        type: object
                        properties:
                          method:
                            type: string
                            const: POST
                          URL:
                            type: string
                          request body:
                            type: object
                            properties:
                              description:
                                type: string
                              URL:
                                type: string
                              reason:
                                type: string
                            required:
                              - description
                              - URL
                              - reason
                            additionalProperties: false
                          how to check whether the request has been fulfilled:
                            type: string
                        required:
                          - method
                          - URL
                          - request body
                          - how to check whether the request has been fulfilled
                        additionalProperties: false
                      how a web user can request that the page be tested:
                        type: object
                        properties:
                          URL:
                            type: string
                        required:
                          - URL
                        additionalProperties: false
                    required:
                      - basics about all available reports
                      - how to request that a page with no report be tested
                      - how a web user can request that the page be tested
                    additionalProperties: false
                required:
                  - tool collection
                  - tool name
                  - this request
                  - URLs of similar requests for web users
                  - response metadata
                  - response content
                additionalProperties: false
  /api/listIssues/{timeStamp}/{jobID}:
    get:
      operationId: listIssues
      summary: List basics about the issues in one report
      parameters:
        - in: path
          name: timeStamp
          schema:
            type: string
            description: 'Timestamp of the report in YYMMDDTHHmm format (example: 260503T0432)'
          required: true
          description: 'Timestamp of the report in YYMMDDTHHmm format (example: 260503T0432)'
        - in: path
          name: jobID
          schema:
            type: string
            description: 'Job identifier of the report (example: x9z)'
          required: true
          description: 'Job identifier of the report (example: x9z)'
      responses:
        '200':
          description: List basics about the issues in one report
          content:
            application/json:
              schema:
                type: object
                properties:
                  tool collection:
                    $ref: '#/components/schemas/ToolsFacts'
                  tool name:
                    type: string
                  this request:
                    type: object
                    properties:
                      description:
                        type: string
                      method:
                        type: string
                        const: GET
                      URL:
                        type: string
                      closest ancestor request:
                        anyOf:
                          - $ref: '#/components/schemas/RequestReference'
                          - type: 'null'
                    required:
                      - description
                      - method
                      - URL
                      - closest ancestor request
                    additionalProperties: false
                  URLs of similar requests for web users:
                    $ref: '#/components/schemas/SimilarWebRequests'
                  response metadata:
                    $ref: '#/components/schemas/ResponseMetadata'
                  response content:
                    type: object
                    properties:
                      basics about the report:
                        $ref: '#/components/schemas/ReportBasicsOrError'
                      details about the report:
                        anyOf:
                          - type: object
                            properties:
                              job definition:
                                type: object
                                properties:
                                  whether the job prohibited redirection:
                                    description: Copied from the report (strict); type not guaranteed.
                                  whether the native results of rule engines are reported:
                                    type: boolean
                                  whether standardized results are reported:
                                    type: boolean
                                  device emulated by the job:
                                    description: Device object copied verbatim from the report; shape may vary.
                                  browser type used by the job:
                                    description: Copied from the report (browserID); type not guaranteed.
                                required:
                                  - whether the job prohibited redirection
                                  - whether the native results of rule engines are reported
                                  - whether standardized results are reported
                                  - device emulated by the job
                                  - browser type used by the job
                                additionalProperties: false
                              test results:
                                type: object
                                properties:
                                  rule engines that tried to test the page:
                                    type: array
                                    items:
                                      $ref: '#/components/schemas/RuleEngineFacts'
                                  rule engines that could not test the page:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        name:
                                          anyOf:
                                            - type: string
                                            - type: 'null'
                                        reason for failure:
                                          description: Copied verbatim from the Testaro report; shape may vary.
                                      required:
                                        - name
                                        - reason for failure
                                      additionalProperties: false
                                  names of rule engines that reported rule violations:
                                    type: array
                                    items:
                                      anyOf:
                                        - type: string
                                        - type: 'null'
                                  counts of issues by priority:
                                    type: object
                                    properties:
                                      highest:
                                        type: number
                                      high:
                                        type: number
                                      low:
                                        type: number
                                      lowest:
                                        type: number
                                    required:
                                      - highest
                                      - high
                                      - low
                                      - lowest
                                    additionalProperties: false
                                  number of elements reported as violators:
                                    type: number
                                required:
                                  - rule engines that tried to test the page
                                  - rule engines that could not test the page
                                  - names of rule engines that reported rule violations
                                  - counts of issues by priority
                                  - number of elements reported as violators
                                additionalProperties: false
                            required:
                              - job definition
                              - test results
                            additionalProperties: false
                          - type: 'null'
                      how to request that the page be retested:
                        anyOf:
                          - anyOf:
                              - type: object
                                properties:
                                  notice:
                                    type: string
                                required:
                                  - notice
                                additionalProperties: false
                              - type: object
                                properties:
                                  method:
                                    type: string
                                    const: POST
                                  URL:
                                    type: string
                                  request body:
                                    type: object
                                    properties:
                                      reason:
                                        type: string
                                    required:
                                      - reason
                                    additionalProperties: false
                                  how to check whether the request has been fulfilled:
                                    type: string
                                required:
                                  - method
                                  - URL
                                  - request body
                                  - how to check whether the request has been fulfilled
                                additionalProperties: false
                          - type: 'null'
                      how a web user can request that the page be retested:
                        anyOf:
                          - type: object
                            properties:
                              URL:
                                type: string
                            required:
                              - URL
                            additionalProperties: false
                          - type: 'null'
                      how to get the full report in JSON:
                        anyOf:
                          - type: object
                            properties:
                              size of the report in bytes:
                                type: number
                              method:
                                type: string
                                const: GET
                              URL:
                                type: string
                            required:
                              - size of the report in bytes
                              - method
                              - URL
                            additionalProperties: false
                          - type: 'null'
                      how a web user can get the full report in JSON:
                        anyOf:
                          - type: object
                            properties:
                              URL:
                                type: string
                            required:
                              - URL
                            additionalProperties: false
                          - type: 'null'
                      basics about all issues reported in the report:
                        type: array
                        items:
                          type: object
                          properties:
                            identifier:
                              type: string
                            summary:
                              type: string
                            impact on a user:
                              type: string
                            priority:
                              type: string
                              enum:
                                - lowest
                                - low
                                - high
                                - highest
                            rule engines with any violations belonging to the issue:
                              type: array
                              items:
                                type: string
                            how to get details about the issue:
                              type: object
                              properties:
                                method:
                                  type: string
                                  const: GET
                                URL:
                                  type: string
                              required:
                                - method
                                - URL
                              additionalProperties: false
                            web users can get details about the issue at:
                              type: string
                          required:
                            - identifier
                            - summary
                            - impact on a user
                            - priority
                            - rule engines with any violations belonging to the issue
                            - how to get details about the issue
                            - web users can get details about the issue at
                          additionalProperties: false
                    required:
                      - basics about the report
                      - details about the report
                      - how to request that the page be retested
                      - how a web user can request that the page be retested
                      - how to get the full report in JSON
                      - how a web user can get the full report in JSON
                      - basics about all issues reported in the report
                    additionalProperties: false
                required:
                  - tool collection
                  - tool name
                  - this request
                  - URLs of similar requests for web users
                  - response metadata
                  - response content
                additionalProperties: false
  /api/listViolators/{issueID}/{timeStamp}/{jobID}:
    get:
      operationId: listViolators
      summary: List elements reported as exhibiting one issue
      parameters:
        - in: path
          name: issueID
          schema:
            type: string
            description: 'Issue identifier (example: contrastPoor)'
          required: true
          description: 'Issue identifier (example: contrastPoor)'
        - in: path
          name: timeStamp
          schema:
            type: string
            description: 'Timestamp of the report in YYMMDDTHHmm format (example: 260503T0432)'
          required: true
          description: 'Timestamp of the report in YYMMDDTHHmm format (example: 260503T0432)'
        - in: path
          name: jobID
          schema:
            type: string
            description: 'Job identifier of the report (example: x9z)'
          required: true
          description: 'Job identifier of the report (example: x9z)'
      responses:
        '200':
          description: List elements reported as exhibiting one issue
          content:
            application/json:
              schema:
                type: object
                properties:
                  tool collection:
                    $ref: '#/components/schemas/ToolsFacts'
                  tool name:
                    type: string
                  this request:
                    type: object
                    properties:
                      description:
                        type: string
                      method:
                        type: string
                        const: GET
                      URL:
                        type: string
                      closest ancestor request:
                        anyOf:
                          - $ref: '#/components/schemas/RequestReference'
                          - type: 'null'
                    required:
                      - description
                      - method
                      - URL
                      - closest ancestor request
                    additionalProperties: false
                  URLs of similar requests for web users:
                    $ref: '#/components/schemas/SimilarWebRequests'
                  response metadata:
                    $ref: '#/components/schemas/ResponseMetadata'
                  response content:
                    type: object
                    properties:
                      basics about the report:
                        $ref: '#/components/schemas/ReportBasicsOrError'
                      basics about the issue:
                        $ref: '#/components/schemas/IssueBasicsOrError'
                      details about the issue:
                        anyOf:
                          - type: object
                            properties:
                              rule engines reporting violations belonging to the issue:
                                type: array
                                items:
                                  $ref: '#/components/schemas/RuleEngineFacts'
                            required:
                              - rule engines reporting violations belonging to the issue
                            additionalProperties: false
                          - type: 'null'
                      basics about all elements reported as exhibiting the issue:
                        anyOf:
                          - type: array
                            items:
                              type: object
                              properties:
                                identifier:
                                  type: string
                                tag name:
                                  description: Copied from the report catalog entry; type not guaranteed.
                                inner text:
                                  description: Copied from the report catalog entry; type not guaranteed.
                                count of rule engines reporting that the element exhibited the issue:
                                  type: number
                                how to get details about the element:
                                  type: object
                                  properties:
                                    URL:
                                      type: string
                                    request method:
                                      type: string
                                      const: GET
                                  required:
                                    - URL
                                    - request method
                                  additionalProperties: false
                                web users can get details about the element at:
                                  type: string
                              required:
                                - identifier
                                - tag name
                                - inner text
                                - count of rule engines reporting that the element exhibited the issue
                                - how to get details about the element
                                - web users can get details about the element at
                              additionalProperties: false
                          - type: 'null'
                    required:
                      - basics about the report
                      - basics about the issue
                      - details about the issue
                      - basics about all elements reported as exhibiting the issue
                    additionalProperties: false
                required:
                  - tool collection
                  - tool name
                  - this request
                  - URLs of similar requests for web users
                  - response metadata
                  - response content
                additionalProperties: false
  /api/listDiagnoses/{catalogIndex}/{issueID}/{timeStamp}/{jobID}:
    get:
      operationId: listDiagnoses
      summary: List diagnoses of how one element exhibited one issue
      parameters:
        - in: path
          name: catalogIndex
          schema:
            type: string
            description: 'Identifier of the issue-exhibiting element in the catalog of elements on the page (example: 372)'
          required: true
          description: 'Identifier of the issue-exhibiting element in the catalog of elements on the page (example: 372)'
        - in: path
          name: issueID
          schema:
            type: string
            description: 'Issue identifier (example: contrastPoor)'
          required: true
          description: 'Issue identifier (example: contrastPoor)'
        - in: path
          name: timeStamp
          schema:
            type: string
            description: 'Timestamp of the report in YYMMDDTHHmm format (example: 260503T0432)'
          required: true
          description: 'Timestamp of the report in YYMMDDTHHmm format (example: 260503T0432)'
        - in: path
          name: jobID
          schema:
            type: string
            description: 'Job identifier of the report (example: x9z)'
          required: true
          description: 'Job identifier of the report (example: x9z)'
      responses:
        '200':
          description: List diagnoses of how one element exhibited one issue
          content:
            application/json:
              schema:
                type: object
                properties:
                  tool collection:
                    $ref: '#/components/schemas/ToolsFacts'
                  tool name:
                    type: string
                  this request:
                    type: object
                    properties:
                      description:
                        type: string
                      method:
                        type: string
                        const: GET
                      URL:
                        type: string
                      closest ancestor request:
                        anyOf:
                          - $ref: '#/components/schemas/RequestReference'
                          - type: 'null'
                    required:
                      - description
                      - method
                      - URL
                      - closest ancestor request
                    additionalProperties: false
                  URLs of similar requests for web users:
                    $ref: '#/components/schemas/SimilarWebRequests'
                  response metadata:
                    $ref: '#/components/schemas/ResponseMetadata'
                  response content:
                    type: object
                    properties:
                      basics about the report:
                        $ref: '#/components/schemas/ReportBasicsOrError'
                      basics about the issue:
                        $ref: '#/components/schemas/IssueBasicsOrError'
                      basics about the element:
                        anyOf:
                          - anyOf:
                              - type: object
                                properties:
                                  identifier:
                                    type: string
                                  tag name:
                                    description: Copied from the report catalog entry; type not guaranteed.
                                  inner text:
                                    description: Copied from the report catalog entry; type not guaranteed.
                                required:
                                  - identifier
                                  - tag name
                                  - inner text
                                additionalProperties: false
                              - type: object
                                properties:
                                  error:
                                    type: string
                                required:
                                  - error
                                additionalProperties: false
                          - type: 'null'
                      details about the element:
                        anyOf:
                          - type: object
                            properties:
                              start tag:
                                description: Copied from the report catalog entry; type not guaranteed.
                              XPath:
                                description: Copied from the report catalog entry; type not guaranteed.
                              x, y, width, and height of bounding box:
                                description: Copied from the report catalog entry; type not guaranteed.
                            required:
                              - start tag
                              - XPath
                              - x, y, width, and height of bounding box
                            additionalProperties: false
                          - type: 'null'
                      diagnoses of how the element exhibited the issue:
                        anyOf:
                          - type: array
                            items:
                              type: object
                              properties:
                                identifier of the violated rule:
                                  description: Copied from the report instance (ruleID); type not guaranteed.
                                description of the violation:
                                  description: Copied from the report instance (what); type not guaranteed.
                                severity of the violation on a 0-to-3 scale:
                                  description: Copied from the report instance (ordinalSeverity); type not guaranteed.
                                count of violations of the rule by the element:
                                  type: number
                              required:
                                - identifier of the violated rule
                                - description of the violation
                                - severity of the violation on a 0-to-3 scale
                                - count of violations of the rule by the element
                              additionalProperties: false
                          - type: object
                            properties:
                              error:
                                type: string
                            required:
                              - error
                            additionalProperties: false
                    required:
                      - basics about the report
                      - basics about the issue
                      - basics about the element
                      - details about the element
                      - diagnoses of how the element exhibited the issue
                    additionalProperties: false
                required:
                  - tool collection
                  - tool name
                  - this request
                  - URLs of similar requests for web users
                  - response metadata
                  - response content
                additionalProperties: false
  /api/getReport/{timeStamp}/{jobID}:
