        site name:
          type: string
        page identifier:
          description: Identifier of the page, or null if the page does not exist yet.
          type:
            - string
            - 'null'
        page name:
          type: string
        URL:
          type: string
      required:
        - site identifier
        - site name
        - page identifier
        - page name
        - URL
      additionalProperties: false
