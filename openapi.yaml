openapi: 3.1.0
info:
  title: Kilotest API
  description: 'Kilotest integrates an ensemble of 12 rule engines, with about 1,300 rules, to test web pages for front-end quality (accessibility, usability, and W3C web standards, including HTML, CSS, ARIA, and WCAG). Each test job generates a standardized report describing which elements violated which rules and grouping the violations into about 380 issues. Kilotest can list the tested sites, the tested pages of each site, the reports about each page, the issues in each report, the violators of each issue, and the diagnoses of each violation. Kilotest also accepts requests to test pages not yet tested and to retest already tested pages. Kilotest acts as a web server for human users, an MCP server for AI platforms, and an API for programmatic access. With this API you can request that a page be tested or retested, discover available reports, and incrementally retrieve facts from a report: from what reports are available, to what issues were reported in one report, to what elements violated one issue, to what diagnoses rule engines gave for one violation.'
  version: 65.2.0
  license:
    name: MIT
    identifier: MIT
  contact:
    name: Kilotest
    url: https://github.com/jrpool/kilotest
    email: info@kilotest.com
servers:
  - url: https://kilotest.com
    description: Kilotest production server
security: []
paths:
  /api/listSites:
    get:
      operationId: listSites
      summary: List all tested sites
      responses:
        '200':
          description: List all tested sites
          content:
            application/json:
              schema:
                type: object
                properties:
                  tool collection:
                    $ref: '#/components/schemas/ToolsFacts'
                  tool name:
                    type: string
                  this request:
                    type: object
                    properties:
                      description:
                        type: string
                      method:
                        type: string
                        const: GET
                      URL:
                        type: string
                      closest ancestor request:
                        anyOf:
                          - $ref: '#/components/schemas/RequestReference'
                          - type: 'null'
                    required:
                      - description
                      - method
                      - URL
                      - closest ancestor request
                    additionalProperties: false
                  URLs of similar requests for web users:
                    $ref: '#/components/schemas/SimilarWebRequests'
                  response metadata:
                    $ref: '#/components/schemas/ResponseMetadata'
                  response content:
                    type: object
                    properties:
                      how to list the tested pages of a site:
                        type: object
                        properties:
                          method:
                            type: string
                            const: GET
                          URL:
                            type: string
                            description: URL template; replace {identifier} with the identifier of the site.
                        required:
                          - method
                          - URL
                        additionalProperties: false
                      web users can list the tested pages of a site at:
                        type: string
                        description: URL template; replace {identifier} with the identifier of the site.
                      basics about all tested sites:
                        type: array
                        items:
                          $ref: '#/components/schemas/SiteFacts'
                      how to request a test of a page of a site not in this list:
                        type: object
                        properties:
                          method:
                            type: string
                            const: POST
                          URL:
                            type: string
                          request body:
                            type: object
                            properties:
                              siteName:
                                type: string
                              pageName:
                                type: string
                              URL:
                                type: string
                              reason:
                                type: string
                              reviewImmediately:
                                type: string
                            required:
                              - siteName
                              - pageName
                              - URL
                              - reason
                              - reviewImmediately
                            additionalProperties: false
                          how to check whether the request has been fulfilled:
                            type: string
                        required:
                          - method
                          - URL
                          - request body
                          - how to check whether the request has been fulfilled
                        additionalProperties: false
                      how a web user can request a test of a page of a site not in this list:
                        type: object
                        properties:
                          URL:
                            type: string
                        required:
                          - URL
                        additionalProperties: false
                    required:
                      - how to list the tested pages of a site
                      - web users can list the tested pages of a site at
                      - basics about all tested sites
                      - how to request a test of a page of a site not in this list
                      - how a web user can request a test of a page of a site not in this list
                    additionalProperties: false
                required:
                  - tool collection
                  - tool name
                  - this request
                  - URLs of similar requests for web users
                  - response metadata
                  - response content
                additionalProperties: false
  /api/listPages/{siteID}:
    get:
      operationId: listPages
      summary: List the tested pages of one site
      parameters:
        - in: path
          name: siteID
          schema:
            type: string
            pattern: ^s-[0-9a-z]{6}$
            description: 'Identifier of the site, formatted s-xxxxxx (example: s-2fw2ea), as shown in the listSites output'
          required: true
          description: 'Identifier of the site, formatted s-xxxxxx (example: s-2fw2ea), as shown in the listSites output'
      responses:
        '200':
          description: List the tested pages of one site
          content:
            application/json:
              schema:
                type: object
                properties:
                  tool collection:
                    $ref: '#/components/schemas/ToolsFacts'
                  tool name:
                    type: string
                  this request:
                    type: object
                    properties:
                      description:
                        type: string
                      method:
                        type: string
                        const: GET
                      URL:
                        type: string
                      closest ancestor request:
                        anyOf:
                          - $ref: '#/components/schemas/RequestReference'
                          - type: 'null'
                    required:
                      - description
                      - method
                      - URL
                      - closest ancestor request
                    additionalProperties: false
                  URLs of similar requests for web users:
                    $ref: '#/components/schemas/SimilarWebRequests'
                  response metadata:
                    $ref: '#/components/schemas/ResponseMetadata'
                  response content:
                    type: object
                    properties:
                      basics about the site:
                        anyOf:
                          - type: object
                            properties:
                              identifier:
                                type: string
                              name:
                                type: string
                            required:
                              - identifier
                              - name
                            additionalProperties: false
                          - type: object
                            properties:
                              error:
                                type: string
                            required:
                              - error
                            additionalProperties: false
                      how to get test results about a page:
                        type: object
                        properties:
                          method:
                            type: string
                            const: GET
                          URL:
                            type: string
                            description: URL template; replace {identifier} with the identifier of the latest report about the page.
                        required:
                          - method
                          - URL
                        additionalProperties: false
                      web users can get test results about a page at:
                        type: string
                        description: URL template; replace {identifier} with the identifier of the latest report about the page.
                      basics about all tested pages of the site:
                        anyOf:
                          - type: array
                            items:
                              $ref: '#/components/schemas/PageFacts'
                          - type: 'null'
                        description: The tested pages of the site, ordered by name, or null if the site does not exist.
                      how to request a test of a page of this site not in this list:
                        anyOf:
                          - type: object
                            properties:
                              method:
                                type: string
                                const: POST
                              URL:
                                type: string
                              request body:
                                type: object
                                properties:
                                  siteID:
                                    type: string
                                    description: Identifier of this site, to be given unchanged.
                                  pageName:
                                    type: string
                                  URL:
                                    type: string
                                  reason:
                                    type: string
                                  reviewImmediately:
                                    type: string
                                required:
                                  - siteID
                                  - pageName
                                  - URL
                                  - reason
                                  - reviewImmediately
                                additionalProperties: false
                              how to check whether the request has been fulfilled:
                                type: string
                            required:
                              - method
                              - URL
                              - request body
                              - how to check whether the request has been fulfilled
                            additionalProperties: false
                          - type: 'null'
                      how a web user can request a test of a page of this site not in this list:
                        anyOf:
                          - type: object
                            properties:
                              URL:
                                type: string
                            required:
                              - URL
                            additionalProperties: false
                          - type: 'null'
                    required:
                      - basics about the site
                      - how to get test results about a page
                      - web users can get test results about a page at
                      - basics about all tested pages of the site
                      - how to request a test of a page of this site not in this list
                      - how a web user can request a test of a page of this site not in this list
                    additionalProperties: false
                required:
                  - tool collection
                  - tool name
                  - this request
                  - URLs of similar requests for web users
                  - response metadata
                  - response content
                additionalProperties: false
  /api/listIssues/{reportID}:
    get:
      operationId: listIssues
      summary: List basics about the issues in one report
      parameters:
        - in: path
          name: reportID
          schema:
            type: string
            pattern: ^\d{2}(?:(?:0[13578]|1[02])(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)(?:0[1-9]|[12]\d|30)|02(?:0[1-9]|1\d|2[0-9]))T(?:[01]\d|2[0-3])[0-5]\d-[a-z0-9]{3}$
            description: 'Identifier of the report, formatted YYMMDDTHHMM-xxx (example: 260503T0432-x9z), as shown in the listPages output or a listIssues report history'
          required: true
          description: 'Identifier of the report, formatted YYMMDDTHHMM-xxx (example: 260503T0432-x9z), as shown in the listPages output or a listIssues report history'
      responses:
        '200':
          description: List basics about the issues in one report
          content:
            application/json:
              schema:
                type: object
                properties:
                  tool collection:
                    $ref: '#/components/schemas/ToolsFacts'
                  tool name:
                    type: string
                  this request:
                    type: object
                    properties:
                      description:
                        type: string
                      method:
                        type: string
                        const: GET
                      URL:
                        type: string
                      closest ancestor request:
                        anyOf:
                          - $ref: '#/components/schemas/RequestReference'
                          - type: 'null'
                    required:
                      - description
                      - method
                      - URL
                      - closest ancestor request
                    additionalProperties: false
                  URLs of similar requests for web users:
                    $ref: '#/components/schemas/SimilarWebRequests'
                  response metadata:
                    $ref: '#/components/schemas/ResponseMetadata'
                  response content:
                    type: object
                    properties:
                      basics about the report:
                        $ref: '#/components/schemas/ReportBasicsOrError'
                      history of reports about the page:
                        anyOf:
                          - type: array
                            items:
                              type: object
                              properties:
                                identifier:
                                  type: string
                                  description: 'Identifier of the report (example: 260503T0432-x9z).'
                                completion date and time:
                                  type: string
                                days since the report was completed:
                                  type:
                                    - number
                                    - 'null'
                                whether it is the oldest report about the page:
                                  type: boolean
                                whether it is the latest report about the page:
                                  type: boolean
                                whether it is the report described in this response:
                                  type: boolean
                                how to get details about the report:
                                  type: object
                                  properties:
                                    method:
                                      type: string
                                      const: GET
                                    URL:
                                      type: string
                                  required:
                                    - method
                                    - URL
                                  additionalProperties: false
                                web users can get details about the report at:
                                  type: string
                              required:
                                - identifier
                                - completion date and time
                                - days since the report was completed
                                - whether it is the oldest report about the page
                                - whether it is the latest report about the page
                                - whether it is the report described in this response
                                - how to get details about the report
                                - web users can get details about the report at
                              additionalProperties: false
                          - type: 'null'
                        description: All reports about the same page, from oldest to latest, or null if the report is unavailable.
                      details about the report:
                        anyOf:
                          - type: object
                            properties:
                              job definition:
                                type: object
                                properties:
                                  whether the job prohibited redirection:
                                    description: Copied from the report (strict); type not guaranteed.
                                  whether the native results of rule engines are reported:
                                    type: boolean
                                  whether standardized results are reported:
                                    type: boolean
                                  device emulated by the job:
                                    description: Device object copied verbatim from the report; shape may vary.
                                  browser type used by the job:
                                    description: Copied from the report (browserID); type not guaranteed.
                                required:
                                  - whether the job prohibited redirection
                                  - whether the native results of rule engines are reported
                                  - whether standardized results are reported
                                  - device emulated by the job
                                  - browser type used by the job
                                additionalProperties: false
                              test results:
                                type: object
                                properties:
                                  rule engines that tried to test the page:
                                    type: array
                                    items:
                                      $ref: '#/components/schemas/RuleEngineFacts'
                                  rule engines that could not test the page:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        name:
                                          type:
                                            - string
                                            - 'null'
                                        reason for failure:
                                          description: Copied verbatim from the Testaro report; shape may vary.
                                      required:
                                        - name
                                        - reason for failure
                                      additionalProperties: false
                                  names of rule engines that reported rule violations:
                                    type: array
                                    items:
                                      type:
                                        - string
                                        - 'null'
                                  counts of issues by priority:
                                    type: object
                                    properties:
                                      highest:
                                        type: number
                                      high:
                                        type: number
                                      low:
                                        type: number
                                      lowest:
                                        type: number
                                    required:
                                      - highest
                                      - high
                                      - low
                                      - lowest
                                    additionalProperties: false
                                  number of elements reported as violators:
                                    type: number
                                required:
                                  - rule engines that tried to test the page
                                  - rule engines that could not test the page
                                  - names of rule engines that reported rule violations
                                  - counts of issues by priority
                                  - number of elements reported as violators
                                additionalProperties: false
                            required:
                              - job definition
                              - test results
                            additionalProperties: false
                          - type: 'null'
                      how to request that the page be retested:
                        anyOf:
                          - anyOf:
                              - type: object
                                properties:
                                  notice:
                                    type: string
                                required:
                                  - notice
                                additionalProperties: false
                              - type: object
                                properties:
                                  method:
                                    type: string
                                    const: POST
                                  URL:
                                    type: string
                                  request body:
                                    type: object
                                    properties:
                                      reason:
                                        type: string
                                    required:
                                      - reason
                                    additionalProperties: false
                                  how to check whether the request has been fulfilled:
                                    type: string
                                required:
                                  - method
                                  - URL
                                  - request body
                                  - how to check whether the request has been fulfilled
                                additionalProperties: false
                          - type: 'null'
                      how a web user can request that the page be retested:
                        anyOf:
                          - type: object
                            properties:
                              URL:
                                type: string
                            required:
                              - URL
                            additionalProperties: false
                          - type: 'null'
                      how to get the full report in JSON:
                        anyOf:
                          - type: object
                            properties:
                              size of the report in bytes:
                                type: number
                              method:
                                type: string
                                const: GET
                              URL:
                                type: string
                            required:
                              - size of the report in bytes
                              - method
                              - URL
                            additionalProperties: false
                          - type: 'null'
                      how a web user can get the full report in JSON:
                        anyOf:
                          - type: object
                            properties:
                              URL:
                                type: string
                            required:
                              - URL
                            additionalProperties: false
                          - type: 'null'
                      basics about all issues reported in the report:
                        anyOf:
                          - type: array
                            items:
                              type: object
                              properties:
                                identifier:
                                  type: string
                                summary:
                                  type: string
                                impact on a user:
                                  type: string
                                priority:
                                  type: string
                                  enum:
                                    - lowest
                                    - low
                                    - high
                                    - highest
                                rule engines with any violations belonging to the issue:
                                  type: array
                                  items:
                                    type:
                                      - string
                                      - 'null'
                                how to get details about the issue:
                                  type: object
                                  properties:
                                    method:
                                      type: string
                                      const: GET
                                    URL:
                                      type: string
                                  required:
                                    - method
                                    - URL
                                  additionalProperties: false
                                web users can get details about the issue at:
                                  type: string
                              required:
                                - identifier
                                - summary
                                - impact on a user
                                - priority
                                - rule engines with any violations belonging to the issue
                                - how to get details about the issue
                                - web users can get details about the issue at
                              additionalProperties: false
                          - type: 'null'
                    required:
                      - basics about the report
                      - history of reports about the page
                      - details about the report
                      - how to request that the page be retested
                      - how a web user can request that the page be retested
                      - how to get the full report in JSON
                      - how a web user can get the full report in JSON
                      - basics about all issues reported in the report
                    additionalProperties: false
                required:
                  - tool collection
                  - tool name
                  - this request
                  - URLs of similar requests for web users
                  - response metadata
                  - response content
                additionalProperties: false
  /api/listViolators/{issueID}/{reportID}:
    get:
      operationId: listViolators
      summary: List elements reported as exhibiting one issue
      parameters:
        - in: path
          name: issueID
          schema:
            type: string
            description: 'Issue identifier (example: contrastPoor), as listed in the listIssues output for the same report'
          required: true
          description: 'Issue identifier (example: contrastPoor), as listed in the listIssues output for the same report'
        - in: path
          name: reportID
          schema:
            type: string
            pattern: ^\d{2}(?:(?:0[13578]|1[02])(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)(?:0[1-9]|[12]\d|30)|02(?:0[1-9]|1\d|2[0-9]))T(?:[01]\d|2[0-3])[0-5]\d-[a-z0-9]{3}$
            description: 'Identifier of the report, formatted YYMMDDTHHMM-xxx (example: 260503T0432-x9z), as shown in the listPages output or a listIssues report history'
          required: true
          description: 'Identifier of the report, formatted YYMMDDTHHMM-xxx (example: 260503T0432-x9z), as shown in the listPages output or a listIssues report history'
      responses:
        '200':
          description: List elements reported as exhibiting one issue
          content:
            application/json:
              schema:
                type: object
                properties:
                  tool collection:
                    $ref: '#/components/schemas/ToolsFacts'
                  tool name:
                    type: string
                  this request:
                    type: object
                    properties:
                      description:
                        type: string
                      method:
                        type: string
                        const: GET
                      URL:
                        type: string
                      closest ancestor request:
                        anyOf:
                          - $ref: '#/components/schemas/RequestReference'
                          - type: 'null'
                    required:
                      - description
                      - method
                      - URL
                      - closest ancestor request
                    additionalProperties: false
                  URLs of similar requests for web users:
                    $ref: '#/components/schemas/SimilarWebRequests'
                  response metadata:
                    $ref: '#/components/schemas/ResponseMetadata'
                  response content:
                    type: object
                    properties:
                      basics about the report:
                        $ref: '#/components/schemas/ReportBasicsOrError'
                      basics about the issue:
                        $ref: '#/components/schemas/IssueBasicsOrError'
                      details about the issue:
                        anyOf:
                          - type: object
                            properties:
                              rule engines reporting violations belonging to the issue:
                                type: array
                                items:
                                  $ref: '#/components/schemas/RuleEngineFacts'
                            required:
                              - rule engines reporting violations belonging to the issue
                            additionalProperties: false
                          - type: 'null'
                      basics about all elements exhibiting the issue:
                        anyOf:
                          - type: array
                            items:
                              type: object
                              properties:
                                identifier:
                                  description: Catalog index of the element in the report; a string or number, copied verbatim.
                                  type:
                                    - string
                                    - number
                                tag name:
                                  description: Copied from the report catalog entry; type not guaranteed.
                                inner text:
                                  description: Copied from the report catalog entry; type not guaranteed.
                                count of rule engines reporting that the element exhibited the issue:
                                  type: number
                                how to get details about the element:
                                  type: object
                                  properties:
                                    method:
                                      type: string
                                      const: GET
                                    URL:
                                      type: string
                                  required:
                                    - method
                                    - URL
                                  additionalProperties: false
                                web users can get details about the element at:
                                  type: string
                              required:
                                - identifier
                                - tag name
                                - inner text
                                - count of rule engines reporting that the element exhibited the issue
                                - how to get details about the element
                                - web users can get details about the element at
                              additionalProperties: false
                          - type: 'null'
                    required:
                      - basics about the report
                      - basics about the issue
                      - details about the issue
                      - basics about all elements exhibiting the issue
                    additionalProperties: false
                required:
                  - tool collection
                  - tool name
                  - this request
                  - URLs of similar requests for web users
                  - response metadata
                  - response content
                additionalProperties: false
  /api/listDiagnoses/{issueID}/{reportID}/{catalogIndex}:
    get:
      operationId: listDiagnoses
      summary: List diagnoses of how one element exhibited one issue
      parameters:
        - in: path
          name: issueID
          schema:
            type: string
            description: 'Issue identifier (example: contrastPoor), as listed in the listIssues output for the same report'
          required: true
          description: 'Issue identifier (example: contrastPoor), as listed in the listIssues output for the same report'
        - in: path
          name: reportID
          schema:
            type: string
            pattern: ^\d{2}(?:(?:0[13578]|1[02])(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)(?:0[1-9]|[12]\d|30)|02(?:0[1-9]|1\d|2[0-9]))T(?:[01]\d|2[0-3])[0-5]\d-[a-z0-9]{3}$
            description: 'Identifier of the report, formatted YYMMDDTHHMM-xxx (example: 260503T0432-x9z), as shown in the listPages output or a listIssues report history'
          required: true
          description: 'Identifier of the report, formatted YYMMDDTHHMM-xxx (example: 260503T0432-x9z), as shown in the listPages output or a listIssues report history'
        - in: path
          name: catalogIndex
          schema:
            type: string
            pattern: ^\d+$
            description: 'Identifier of the issue-exhibiting element in the catalog of elements on the page (example: 372), as shown in the listViolators output'
          required: true
          description: 'Identifier of the issue-exhibiting element in the catalog of elements on the page (example: 372), as shown in the listViolators output'
      responses:
        '200':
          description: List diagnoses of how one element exhibited one issue
          content:
            application/json:
              schema:
                type: object
                properties:
                  tool collection:
                    $ref: '#/components/schemas/ToolsFacts'
                  tool name:
                    type: string
                  this request:
                    type: object
                    properties:
                      description:
                        type: string
                      method:
                        type: string
                        const: GET
                      URL:
                        type: string
                      closest ancestor request:
                        anyOf:
                          - $ref: '#/components/schemas/RequestReference'
                          - type: 'null'
                    required:
                      - description
                      - method
                      - URL
                      - closest ancestor request
                    additionalProperties: false
                  URLs of similar requests for web users:
                    $ref: '#/components/schemas/SimilarWebRequests'
                  response metadata:
                    $ref: '#/components/schemas/ResponseMetadata'
                  response content:
                    type: object
                    properties:
                      basics about the report:
                        $ref: '#/components/schemas/ReportBasicsOrError'
                      basics about the issue:
                        $ref: '#/components/schemas/IssueBasicsOrError'
                      basics about the element:
                        anyOf:
                          - anyOf:
                              - type: object
                                properties:
                                  identifier:
                                    type: string
                                  tag name:
                                    description: Copied from the report catalog entry; type not guaranteed.
                                  inner text:
                                    description: Copied from the report catalog entry; type not guaranteed.
                                required:
                                  - identifier
                                  - tag name
                                  - inner text
                                additionalProperties: false
                              - type: object
                                properties:
                                  error:
                                    type: string
                                required:
                                  - error
                                additionalProperties: false
                          - type: 'null'
                      details about the element:
                        anyOf:
                          - type: object
                            properties:
                              start tag:
                                description: Copied from the report catalog entry; type not guaranteed.
                              XPath:
                                description: Copied from the report catalog entry; type not guaranteed.
                              x, y, width, and height of bounding box:
                                description: Copied from the report catalog entry; type not guaranteed.
                            required:
                              - start tag
                              - XPath
                              - x, y, width, and height of bounding box
                            additionalProperties: false
                          - type: 'null'
                      diagnoses of how the element exhibited the issue:
                        anyOf:
                          - anyOf:
                              - type: array
                                items:
                                  type: object
                                  properties:
                                    identifier of the rule engine:
                                      description: Copied from the report act (which); type not guaranteed.
                                    identifier of the violated rule:
                                      description: Copied from the report instance (ruleID); type not guaranteed.
                                    description of the violation:
                                      description: Copied from the report instance (what); type not guaranteed.
                                    severity of the violation on a 0-to-3 scale:
                                      description: Copied from the report instance (ordinalSeverity); type not guaranteed.
                                    count of violations of the rule by the element:
                                      type: number
