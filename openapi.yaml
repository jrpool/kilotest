      operationId: getReport
      summary: Get one full report in JSON
      parameters:
        - in: path
          name: timeStamp
          schema:
            type: string
            description: 'Timestamp of the report in YYMMDDTHHmm format (example: 260503T0432)'
          required: true
          description: 'Timestamp of the report in YYMMDDTHHmm format (example: 260503T0432)'
        - in: path
          name: jobID
          schema:
            type: string
            description: 'Job identifier of the report (example: x9z)'
          required: true
          description: 'Job identifier of the report (example: x9z)'
      responses:
        '200':
          description: Get one full report in JSON
          content:
            application/json:
              schema:
                type: object
                properties:
                  tool collection:
                    $ref: '#/components/schemas/ToolsFacts'
                  tool name:
                    type: string
                  this request:
                    type: object
                    properties:
                      description:
                        type: string
                      method:
                        type: string
                        const: GET
                      URL:
                        type: string
                      closest ancestor request:
                        anyOf:
                          - $ref: '#/components/schemas/RequestReference'
                          - type: 'null'
                    required:
                      - description
                      - method
                      - URL
                      - closest ancestor request
                    additionalProperties: false
                  URLs of similar requests for web users:
                    $ref: '#/components/schemas/SimilarWebRequests'
                  response metadata:
                    $ref: '#/components/schemas/ResponseMetadata'
                  response content:
                    type: object
                    properties:
                      size of the report in bytes:
                        anyOf:
                          - type: number
                          - type: string
                      full report:
                        description: The full raw Testaro/Testilo report JSON, copied verbatim, or an error object if it could not be retrieved.
                    required:
                      - size of the report in bytes
                      - full report
                    additionalProperties: false
                required:
                  - tool collection
                  - tool name
                  - this request
                  - URLs of similar requests for web users
                  - response metadata
                  - response content
                additionalProperties: false
  /api/requestTest:
    post:
      operationId: requestTest
      summary: Request that a page be tested
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  description: 10- to 100-character description of the page conforming to the naming convention used in the listReports output
                URL:
                  type: string
                  description: 12- to 300-character URL of the page, including the https:// scheme and any query
                reason:
                  type: string
                  description: 20- to 100-character reason why the page should be tested
              required:
                - description
                - URL
                - reason
      responses:
        '200':
          description: Request that a page be tested
          content:
            application/json:
              schema:
                type: object
                properties:
                  tool collection:
                    $ref: '#/components/schemas/ToolsFacts'
                  tool name:
                    type: string
                  this request:
                    type: object
                    properties:
                      description:
                        type: string
                      method:
                        type: string
                        const: POST
                      URL:
                        type: string
                      body:
                        type: object
                        properties:
                          description:
                            type: string
                            description: 10- to 100-character description of the page conforming to the naming convention used in the listReports output
                          URL:
                            type: string
                            description: 12- to 300-character URL of the page, including the https:// scheme and any query
                          reason:
                            type: string
                            description: 20- to 100-character reason why the page should be tested
                        required:
                          - description
                          - URL
                          - reason
                        additionalProperties: false
                      closest ancestor request:
                        anyOf:
                          - $ref: '#/components/schemas/RequestReference'
                          - type: 'null'
                    required:
                      - description
                      - method
                      - URL
                      - body
                      - closest ancestor request
                    additionalProperties: false
                  URLs of similar requests for web users:
                    $ref: '#/components/schemas/SimilarWebRequests'
                  response metadata:
                    $ref: '#/components/schemas/ResponseMetadata'
                  response content:
                    type: object
                    properties:
                      details about your request:
                        anyOf:
                          - type: object
                            properties:
                              error:
                                type: string
                            required:
                              - error
                            additionalProperties: false
                          - type: object
                            properties:
                              date and time received:
                                type: string
                              page to be tested:
                                type: object
                                properties:
                                  description:
                                    type: string
                                  URL:
                                    type: string
                                required:
                                  - description
                                  - URL
                                additionalProperties: false
                              reason why the page should be tested:
                                type: string
                            required:
                              - date and time received
                              - page to be tested
                              - reason why the page should be tested
                            additionalProperties: false
                    required:
                      - details about your request
                    additionalProperties: false
                required:
                  - tool collection
                  - tool name
                  - this request
                  - URLs of similar requests for web users
                  - response metadata
                  - response content
                additionalProperties: false
  /api/requestRetest/{timeStamp}/{jobID}:
    post:
      operationId: requestRetest
      summary: Request that a page be retested
      parameters:
        - in: path
          name: timeStamp
          schema:
            type: string
            description: 'Timestamp of the latest report about the page in YYMMDDTHHmm format (example: 260503T0432)'
          required: true
          description: 'Timestamp of the latest report about the page in YYMMDDTHHmm format (example: 260503T0432)'
        - in: path
          name: jobID
          schema:
            type: string
            description: 'Job identifier of the latest report about the page (example: x9z)'
          required: true
          description: 'Job identifier of the latest report about the page (example: x9z)'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: 20- to 100-character reason why the page should be retested
              required:
                - reason
      responses:
        '200':
          description: Request that a page be retested
          content:
            application/json:
              schema:
                type: object
                properties:
                  tool collection:
                    $ref: '#/components/schemas/ToolsFacts'
                  tool name:
                    type: string
                  this request:
                    type: object
                    properties:
                      description:
                        type: string
                      method:
                        type: string
                        const: POST
