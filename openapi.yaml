components:
  schemas:
    ToolsFacts:
      type: object
      properties:
        name:
          type: string
        description:
          type: object
          properties:
            what Kilotest does:
              type: string
            how to retrieve findings:
              type: object
              properties:
                level 1:
                  type: string
                level 2:
                  type: string
                level 3:
                  type: string
                level 4:
                  type: string
              required:
                - level 1
                - level 2
                - level 3
                - level 4
              additionalProperties: false
            how to generate more findings:
              type: object
              properties:
                new testing:
                  type: string
                retesting:
                  type: string
                latency:
                  type: string
                confirmation:
                  type: string
              required:
                - new testing
                - retesting
                - latency
                - confirmation
              additionalProperties: false
          required:
            - what Kilotest does
            - how to retrieve findings
            - how to generate more findings
          additionalProperties: false
          description: Explanation of what Kilotest does and how to use its tools.
        URL:
          type: string
          description: URL of the Kilotest MCP server.
        web users can obtain similar functionalities at:
          type: string
      required:
        - name
        - description
        - URL
        - web users can obtain similar functionalities at
      additionalProperties: false
    RequestReference:
      type: object
      properties:
        tool name:
          type: string
        description:
          type: string
        method:
          type: string
          const: GET
        URL:
          type: string
      required:
        - tool name
        - description
        - method
        - URL
      additionalProperties: false
    SimilarWebRequests:
      type: object
      properties:
        this request:
          type: string
          description: URL of the equivalent web UI page for this request.
        closest ancestor request:
          anyOf:
            - type: string
            - type: 'null'
      required:
        - this request
        - closest ancestor request
      additionalProperties: false
    ResponseMetadata:
      type: object
      properties:
        identifier:
          type: string
          description: Unique identifier of this response (timestamp and random suffix).
        date and time:
          type: string
          description: UTC date and time when the response was generated, in ISO 8601 format.
      required:
        - identifier
        - date and time
      additionalProperties: false
    ReportBasicsOrError:
      anyOf:
        - $ref: '#/components/schemas/ReportBasics'
        - type: object
          properties:
            error:
              type: string
          required:
            - error
          additionalProperties: false
    ReportBasics:
      type: object
      properties:
        identifier:
          type: string
          description: timeStamp-jobID identifier of the report.
        completion date and time:
          type: string
        days since the report was completed:
          type: number
        tested web page:
          type: object
          properties:
            description:
              type: string
            URL:
              type: string
          required:
            - description
            - URL
          additionalProperties: false
        whether a later report about the same page exists:
          type: boolean
      required:
        - identifier
        - completion date and time
        - days since the report was completed
        - tested web page
        - whether a later report about the same page exists
      additionalProperties: false
    RuleEngineFacts:
      type: object
      properties:
        identifier:
          type: string
        name:
          anyOf:
            - type: string
            - type: 'null'
        sponsor:
          anyOf:
            - type: string
            - type: 'null'
      required:
        - identifier
        - name
        - sponsor
      additionalProperties: false
    IssueBasicsOrError:
      anyOf:
        - type: object
          properties:
            identifier:
              type: string
            summary:
              type: string
            impact on a user:
              type: string
            priority:
              type: string
              enum:
                - lowest
                - low
                - high
                - highest
            related WCAG standard:
              type: object
              properties:
                layer:
                  type: string
                  enum:
                    - success criterion
                    - guideline
                identifier:
                  type: string
              required:
                - layer
                - identifier
              additionalProperties: false
          required:
            - identifier
            - summary
            - impact on a user
            - priority
            - related WCAG standard
          additionalProperties: false
        - type: object
          properties:
            error:
              type: string
          required:
            - error
          additionalProperties: false
