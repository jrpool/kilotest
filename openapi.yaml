                    $ref: '#/components/schemas/ResponseMetadata'
                  response content:
                    type: object
                    properties:
                      details about your wait:
                        anyOf:
                          - type: object
                            properties:
                              error:
                                type: string
                            required:
                              - error
                            additionalProperties: false
                          - type: object
                            properties:
                              report identifier:
                                type: string
                                description: 'Identifier of the report, to pass to listIssues once the report is ready (example: 260503T0432-x9z).'
                            required:
                              - report identifier
                            additionalProperties: false
                      disposition of your wait:
                        anyOf:
                          - type: object
                            properties:
                              outcome:
                                type: string
                                enum:
                                  - completed
                                  - failed
                                  - timedOut
                              what happened:
                                type: string
                              how you can check for completion:
                                type: string
                            required:
                              - outcome
                              - what happened
                              - how you can check for completion
                            additionalProperties: false
                          - type: 'null'
                    required:
                      - details about your wait
                      - disposition of your wait
                    additionalProperties: false
                required:
                  - tool collection
                  - tool name
                  - this request
                  - URLs of similar requests for web users
                  - response metadata
                  - response content
                additionalProperties: false
components:
  schemas:
    ToolsFacts:
      type: object
      properties:
        name:
          type: string
        description:
          type: object
          properties:
            what Kilotest does:
              type: string
            how to retrieve findings:
              type: object
              properties:
                level 1:
                  type: string
                level 2:
                  type: string
                level 3:
                  type: string
                level 4:
                  type: string
              required:
                - level 1
                - level 2
                - level 3
                - level 4
              additionalProperties: false
            how to generate more findings:
              type: object
              properties:
                new testing:
                  type: string
                retesting:
                  type: string
                approval:
                  type: string
                latency:
                  type: string
                request confirmation:
                  type: string
                order confirmation:
                  type: string
              required:
                - new testing
                - retesting
                - approval
                - latency
                - request confirmation
                - order confirmation
              additionalProperties: false
          required:
            - what Kilotest does
            - how to retrieve findings
            - how to generate more findings
          additionalProperties: false
          description: Explanation of what Kilotest does and how to use its tools.
        URL:
          type: string
          description: URL of the Kilotest MCP server.
        web users can obtain similar functionalities at:
          type: string
      required:
        - name
        - description
        - URL
        - web users can obtain similar functionalities at
      additionalProperties: false
    RequestReference:
      type: object
      properties:
        tool name:
          type: string
        description:
          type: string
        method:
          type: string
          enum:
            - GET
            - POST
        URL:
          type: string
      required:
        - tool name
        - description
        - method
        - URL
      additionalProperties: false
    SimilarWebRequests:
      type: object
      properties:
        this request:
          type: string
          description: URL of the equivalent web UI page for this request.
        closest ancestor request:
          type:
            - string
            - 'null'
      required:
        - this request
        - closest ancestor request
      additionalProperties: false
    ResponseMetadata:
      type: object
      properties:
        identifier:
          type: string
          description: Unique identifier of this response (timestamp and random suffix).
        date and time:
          type: string
          description: UTC date and time when the response was generated, in ISO 8601 format.
      required:
        - identifier
        - date and time
      additionalProperties: false
    SiteFacts:
      type: object
      properties:
        identifier:
          type: string
          description: 'Identifier of the site (example: s-2fw2ea).'
        name:
          type: string
        count of tested pages:
          type: number
      required:
        - identifier
        - name
        - count of tested pages
      additionalProperties: false
    PageFacts:
      type: object
      properties:
        identifier:
          type: string
          description: 'Identifier of the page (example: p-l6vni7ua).'
        name:
          type: string
          description: Name of the page, distinguishing it from the other pages of its site.
        URL:
          type: string
        sites:
          type: array
          items:
            $ref: '#/components/schemas/PageSite'
          description: The sites that the page belongs to (currently always one).
        identifier of the latest report:
          type: string
          description: 'Identifier of the latest report about the page (example: 260503T0432-x9z).'
      required:
        - identifier
        - name
        - URL
        - sites
        - identifier of the latest report
      additionalProperties: false
    PageSite:
      type: object
      properties:
        identifier:
          type: string
          description: 'Identifier of the site (example: s-2fw2ea).'
        name:
          type: string
          description: Current name of the site.
      required:
        - identifier
        - name
      additionalProperties: false
