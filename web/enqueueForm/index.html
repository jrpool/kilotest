<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="publisher" content="Jonathan Robert Pool">
    <meta name="creator" content="Jonathan Robert Pool">
    <meta name="keywords" content="report,accessibility,a11y">
    <title>Request approval or rejection | Kilotest</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main>
      <h1><a href="/">Kilotest</a>: Request approval or rejection</h1>
      <p>To approve a test or retest request, check its requested page name.</p>
      <p>To approve testing a page that has not yet been requested, first <a href="listReports.html">request it</a>.</p>
      <p>To reject all requests for a page, check the radio button of its URL.</p>
      <form action="/requestAction.html" method="post">
        <fieldset>
          <legend>Requests</legend>
          __requests__
          <p>__noRequests__</p>
        </fieldset>
        <p><label>
          Authorization code:
          <input size="3" minLength="3" maxlength="3" name="authCode" required__disabled__>
        </label></p>
        <p><button type="submit"__disabled__>Submit</button></p>
      </form>
    </main>
  </body>
</html>
