<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="publisher" content="Jonathan Robert Pool">
    <meta name="creator" content="Jonathan Robert Pool">
    <meta name="keywords" content="large language models,tools,model context protocol">
    <meta name="description" content="Kilotest comments: submit bugs and recommended improvements for the QAI tutorial">
    <title>Comments: AI Platform Tutorial | Kilotest</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/style.css">
    <style>
      .comment-section {
        margin: 2rem 0;
      }
      .comment-section label {
        display: block;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }
      .comment-section textarea {
        width: 100%;
        padding: 0.5rem;
        border: solid 1px #ccc;
        border-radius: 0.25rem;
        font-family: system-ui, sans-serif;
        font-size: 1rem;
      }
      .char-count {
        font-size: 0.875rem;
        color: #666;
        margin-top: 0.25rem;
      }
      .char-count.low {
        color: #c80;
        font-weight: 700;
      }
      .comment-diagnosis {
        margin-top: 0.75rem;
        padding: 0.5rem 0.75rem;
        border-radius: 0.25rem;
        min-height: 1.5rem;
      }
      .comment-diagnosis.error {
        background: #fdecea;
        border-left: solid 4px #c0392b;
        color: #5a1a1a;
      }
      .comment-diagnosis.success {
        background: #e6f4ea;
        border-left: solid 4px #2d7a2d;
        color: #1a4a1a;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>QAI tutorial feedback</h1>
      <p>Your comments on the Kilotest AI connector tutorial are welcome! Please comment by submitting this form. A valid submission requires a comment 20 to 1000 characters long.</p>
      <p>Alternatively, you can submit an issue on the <a href="https://github.com/jrpool/kilotest/issues">Kilotest GitHub repository</a>.</p>
      <section class="comment-section">
        <form id="comment-form" novalidate>
          <label for="comment-text">Your feedback:</label>
          <textarea
            id="comment-text"
            name="content"
            maxlength="1000"
            minlength="20"
            rows="10"
            autocomplete="off"
            aria-describedby="char-count-msg"
          ></textarea>
          <p class="char-count" id="char-count-msg"><span id="char-remaining">1000</span> characters remaining</p>
          <button type="submit" id="comment-submit">Submit feedback</button>
        </form>
        <div role="status" id="comment-diagnosis" aria-live="polite" aria-atomic="true" class="comment-diagnosis"></div>
      </section>
    </main>
    <script>
      const commentText = document.getElementById('comment-text');
      const charRemaining = document.getElementById('char-remaining');
      const charCountMsg = document.getElementById('char-count-msg');
      const commentFeedback = document.getElementById('comment-diagnosis');
      const commentSubmit = document.getElementById('comment-submit');

      commentText.addEventListener('input', function () {
        const remaining = 1000 - this.value.length;
        charRemaining.textContent = remaining;
        charCountMsg.className = remaining <= 100 ? 'char-count low' : 'char-count';
      });

      document.getElementById('comment-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const content = commentText.value.trim();
        commentFeedback.className = 'comment-diagnosis';
        commentFeedback.textContent = '';
        if (!content) {
          commentFeedback.className = 'comment-diagnosis error';
          commentFeedback.textContent = 'Please enter your feedback before submitting.';
          return;
        }
        commentSubmit.disabled = true;
        try {
          const response = await fetch('/qaiComment.html', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({content})
          });
          const data = await response.json();
          if (data.status === 'ok') {
            commentFeedback.className = 'comment-diagnosis success';
            commentFeedback.textContent =
              'Thank you! Your feedback has been saved and will be reviewed by the Kilotest team.';
            this.reset();
            charRemaining.textContent = '1000';
            charCountMsg.className = 'char-count';
          } else {
            commentFeedback.className = 'comment-diagnosis error';
            commentFeedback.textContent =
              data.message || 'Your feedback could not be saved. Please try again later.';
            commentSubmit.disabled = false;
          }
        } catch (_) {
          commentFeedback.className = 'comment-diagnosis error';
          commentFeedback.textContent =
            'A connection error occurred. Please check your connection and try again.';
          commentSubmit.disabled = false;
        }
      });
    </script>
  </body>
</html>
