<!DOCTYPE html>
<html lang="en-US">
  <head>
    __head__
    <meta name="keywords" content="report,accessibility,a11y">
    <title>Test request__forSite__ | Kilotest</title>
  </head>
  <body class="styled">
    __header__
    <main class="page">
      <h1>Test request__forSite__</h1>
__intro__
      <form action="/requestNewTest.html" method="post">
__siteField__
        <p><label>
          Describe the page (e.g., <q>home</q>, <q>about</q>, <q>contact</q>, <q>shop</q>, <q>blog</q>, <q>subscribe</q>, <q>sign up</q>).<br>
          <input size="50" maxlength="120" name="pageName" required>
        </label></p>
        <p><label>
          Page URL (starting with <code>https://</code>)<br>
          <input type="url" size="60" minlength="12" maxlength="300" name="url" pattern="https://.+\..+" required>
        </label></p>
        <p><label>
          Why test the page?<br>
          <input size="70" minlength="5" maxlength="100" name="why" required>
        </label></p>
        <p><button type="submit">Submit</button></p>
      </form>
    </main>
    __footer__
  </body>
</html>
