<!DOCTYPE html>
<html lang="en-US">
  <head>
    __head__
    <meta name="keywords" content="report,accessibility,a11y">
    <title>Test request | Kilotest</title>
  </head>
  <body>
    <main>
      <h1><a href="/">Kilotest</a>: Test request</h1>
      <p>You may request that a web page be tested by submitting the following form. All answers are required.</p>
      <form action="/requestNewTest.html" method="post">
        <p><label>
          Propose a name for the page.<br>
          <input size="50" maxlength="70" name="description" required>
        </label></p>
        <p><label>
          What is the URL (starting with <code>https://</code>)?<br>
          <input type="url" size="60" minlength="12" maxlength="300" name="url" pattern="https://.+\..+" required>
        </label></p>
        <p><label>
          Why test the page?<br>
          <input size="70" minlength="5" maxlength="100" name="why" required>
        </label></p>
        <p><button type="submit">Submit</button></p>
      </form>
    </main>
  </body>
</html>
